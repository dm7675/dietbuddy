# Render Blueprint: deploys the web version of DietBuddy as a free static site.
# Render ? New ? Blueprint ? pick this repo. Fill in the two EXPO_PUBLIC_ values
# (from Supabase, see RECEIPTS-SETUP.md) or leave them empty to deploy without AI features.
services:
  - type: web
    name: dietbuddy
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Single-page app: every path (e.g. /plan, /track) is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
